<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AltSchool Application Form</title>
  </head>
  <body>
    <header>
      <nav>
        <ul>
           <li><a href="./index.html">Student Profile Page</a></li>
           <li><a href="./form.html">Application Form</a></li>
      </ul>
      </nav>
    </header>
    <div id="top"></div>
    <h1>Sign in</h1>
    <p>
      Enter your email address and password to securely log in to AltSchool
      Student Portal
    </p>

    <main>
      <form action="/submit" method="POST">
      <fieldset>
        <div>
            <p>
              <div>
              <label for="email"
              >Email<span class="required-star"></span>*</label><br/>
            <input
              type="email"
              id="user-email"
              name="email"
              required
            />
            </div>
            </p>
          
            <p>
              <div>
              <label for="password">Password<span class="required-star">*</span></label><br>
            <input
              type="password"
              id="user-password"
              name="password"
              required
            />
            </div>
            </p>
        </div>
      </fieldset>
    </form>
    </main>
    
    <p>
      <button>Proceed to Dashboard</button>
    </p>
    <p>Forgot your password?<a href="Reset-html"> Reset Now!</a></p>

    <footer>
      <address>College of Medicine, Idi-Araba, Lagos.</address>
      <a>&copy 2026 AltSchool Africa School of Engineering.</a>
    </footer>

    <a href="#top" class="back-link"> Back to Top</a>
  </body>
</html>
